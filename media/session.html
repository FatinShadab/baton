<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
  <link rel="stylesheet" href="{{styleUri}}">
  <title>Session Manager</title>
</head>
<body>
  <header class="session-header">
    <div class="session-brand">
      <svg class="baton-brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 16 10-10a2.12 2.12 0 0 1 3 3L9 19a2.12 2.12 0 0 1-3-3Z"/>
        <path d="m13 9 3 3M5 5v4M3 7h4"/>
      </svg>
      <span class="brand-title">Baton</span>
    </div>
    <div class="section-label">
      <span class="section-arrow">▾</span> SESSION MANAGER
    </div>
  </header>

  <div class="session-actions">
    <button id="new-session-btn" type="button" class="btn-new-session">
      <span class="plus-icon">+</span> New session
    </button>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="session-search" type="search" placeholder="Search sessions..." autocomplete="off" spellcheck="false">
  </div>

  <div id="session-list" class="session-list" role="list">
    <div id="empty-state" class="empty-state">
      <p class="empty-msg">No sessions yet</p>
      <p class="empty-hint">Start a new task or conversation to create your first session.</p>
    </div>
  </div>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
