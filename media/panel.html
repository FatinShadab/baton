<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
  <link rel="stylesheet" href="{{styleUri}}">
  <title>Baton</title>
</head>
<body>
  <h1>Baton</h1>
  <div class="tabs" role="tablist" aria-label="Baton views">
    <button id="task-tab" type="button" role="tab" aria-selected="true" aria-controls="task-pane">Task</button>
    <button id="history-tab" type="button" role="tab" aria-selected="false" aria-controls="history-pane" tabindex="-1">History</button>
  </div>
  <section id="task-pane" role="tabpanel" aria-labelledby="task-tab">
  <form id="task-form">
    <label for="task">Coding task</label>
    <textarea id="task" rows="8" placeholder="What would you like to build?" required></textarea>
    <button type="submit">Prepare context</button>
    <details id="context-preview" hidden>
      <summary>What will be shared</summary>
      <p>The task above and the selected context below will be sent when you route.</p>
      <div id="context-sources"></div>
      <p id="context-size"></p>
      <pre id="context-text"></pre>
      <button id="refresh-context" type="button">Refresh context</button>
    </details>
  </form>
  <section id="result" role="status" aria-live="polite" aria-atomic="true">
    <p id="routing-status"></p>
  <article id="route-card" hidden>
      <h2>Route <span id="risk" class="risk"></span></h2>
      <p id="router-tier"></p>
      <dl>
        <dt>Type</dt><dd id="route-type"></dd>
        <dt>Destination</dt><dd id="destination"></dd>
        <dt>Research needed</dt><dd id="research"></dd>
        <dt>Reason</dt><dd id="reason"></dd>
        <dt>Policy action</dt><dd id="action"></dd>
      </dl>
      <p id="policy-why"></p>
      <div id="handoff-buttons">
        <button id="plan-chatgpt" type="button">Plan in ChatGPT</button>
        <button id="plan-gemini" type="button">Plan in Gemini</button>
        <button id="run-codex" type="button" disabled title="Coming soon">Run in Codex</button>
      </div>
      <div id="plan-section" hidden>
        <label for="plan-text">Paste the plan here</label>
        <textarea id="plan-text" rows="8" placeholder="Paste the implementation plan you received…"></textarea>
        <div class="plan-actions">
          <button id="use-clipboard" type="button">Use clipboard</button>
          <button id="save-plan" type="button">Save plan</button>
        </div>
        <p id="plan-status" role="status" aria-live="polite"></p>
      </div>
    </article>
  </section>
  </section>
  <section id="history-pane" role="tabpanel" aria-labelledby="history-tab" hidden>
    <button id="refresh-history" type="button">Refresh history</button>
    <p id="history-status" role="status" aria-live="polite"></p>
    <div id="history-list"></div>
  </section>
  <script nonce="{{nonce}}" src="{{historyUri}}"></script>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
